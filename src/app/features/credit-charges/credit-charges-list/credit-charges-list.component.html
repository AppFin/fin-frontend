<fin-page-layout
  title="finCore.features.creditCharge.title"
  [loading]="loading()"
>
  <div header>
    <fin-button
      (onClick)="createCreditCharge()"
      iconSuffix="plus"
      text="finCore.actions.new"
    />
    <fin-button
      (onClick)="openFilter()"
      icon="search"
      variant="outlined"
      iconColor="var(--color-secondary)"
      text="finCore.actions.filter"
    />
  </div>

  <fin-grid [options]="gridOptions()" />
</fin-page-layout>

<ng-template
  #filter
  let-closeFn="closeFn"
  let-input="input"
>
  <fin-credit-charges-list-filter
    (applyFilter)="closeFn($event)"
    [currentAppliedFilter]="input"
  />
</ng-template>
