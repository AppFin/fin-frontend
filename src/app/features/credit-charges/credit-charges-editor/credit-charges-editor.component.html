<fin-editor-layout
  [title]="
    this.editorType() == editorTypes.Create
      ? 'finCore.actions.creating'
      : 'finCore.actions.editingName|name:' + entityEditingName()
  "
  [loading]="loading()"
  [formGroup]="formGroup"
  [canSave]="canSave"
  [isSaving]="saving()"
  (onSave)="save()"
  (onCancel)="close()"
>
  @if (!loading()) {
  <fin-input
    class="col-12"
    label="finCore.features.shared.description"
    [formControl]="formGroup.controls.description"
  />

  <fin-money-input
    [allowNegativeNumbers]="false"
    class="col-6"
    label="finCore.features.shared.value"
    [formControl]="formGroup.controls.value"
  />

  <fin-number-input
    class="col-6"
    label="finCore.features.creditCharge.numberOfInstallments"
    [formControl]="formGroup.controls.numberOfInstallments"
    [min]="1"
  />

  <fin-credit-card-select
    class="col-6"
    [formControl]="formGroup.controls.creditCardId"
  />

  <fin-datetime
    class="col-6"
    label="finCore.features.shared.date"
    [formControl]="formGroup.controls.date"
  />

  <fin-title-category-multi-select
    class="col-12"
    [formControl]="formGroup.controls.creditChargeCategoriesIds"
  />

  <fin-person-multi-select
    class="col-12"
    [formControl]="simplePersonFormControl"
    [inactivatedFilter]="false"
  />

  <fin-toggle-switch
    class="col-3"
    label="finCore.features.creditCharge.advancedFinancialSplit"
    [formControl]="isAdvancedPersonSplitEnabled"
  />

  @if (isAdvancedPersonSplitEnabled.value) {
  <div
    [@ifVertical]
    class="col-12 fin-grid-layout"
  >
    @for (personForm of advancedPersonFormArray.controls; track $index) {
    <fin-person-select
      [formControl]="personForm.controls.personId"
      class="col-6"
    />
    <fin-percentage-input
      [formControl]="personForm.controls.financialSplit"
      label="finCore.features.shared.percentage"
      class="col-6"
    />
    }
  </div>
  }
  }
</fin-editor-layout>
